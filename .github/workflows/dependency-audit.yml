name: Dependency Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Audit locked dependencies
        run: uv audit --locked --preview-features audit-command
