name: Request gated Deploy Dev

# Compatibility entry point only. The authoritative workflow owns all build,
# Coolify mutation, and verification after its eleven validation jobs pass.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  request-deploy-dev:
    name: Request authoritative Deploy Dev workflow
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Dev on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dev.yml --repo "${GITHUB_REPOSITORY}" --ref main
