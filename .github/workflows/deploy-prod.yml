name: Manual Production Deployment

on:
  workflow_dispatch:
    inputs:
      confirmProdDeploy:
        type: boolean
        description: "Confirm deployment to production"
        required: true
        default: false
      deployTag:
        type: string
        description: "Release tag or full SHA (optional, defaults to current DEV release)"
        required: false

# Retain conservative serialization with emergency production operations.
# Deploy Dev already deploys both Coolify runtimes; this workflow attests the
# exact fully green release without restarting either runtime a second time.
concurrency:
  group: production-ecs-mutation
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify production promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: coolify-staging
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - name: Require explicit production confirmation
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirmProdDeploy }}
        run: test "${CONFIRM_DEPLOY}" = true

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deployment helper dependencies
        run: uv sync --locked

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Attest green DEV release in production
        env:
          REQUESTED_TAG: ${{ inputs.deployTag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_AISL_SERVICE_UUID: ${{ secrets.COOLIFY_AISL_SERVICE_UUID }}
          COOLIFY_AISL_WEB_APPLICATION_UUID: ${{ vars.COOLIFY_AISL_WEB_APPLICATION_UUID }}
          AISL_DEPLOY_VERIFICATION_API_TOKEN: ${{ secrets.AISL_DEPLOY_VERIFICATION_API_TOKEN }}
        run: uv run python -m deploy.coolify.attest_production

      - name: Verify production sitemap and robots
        run: |
          set -euo pipefail
          echo "Prod verified — /ping returned the green DEV revision."
          uv run python deploy/verify_sitemap.py \
            https://aishippinglabs.com/sitemap.xml https://aishippinglabs.com
          uv run python deploy/verify_robots.py \
            https://aishippinglabs.com/robots.txt https://aishippinglabs.com/sitemap.xml
          exit 0
