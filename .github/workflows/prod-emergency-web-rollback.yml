name: Emergency Production Web Rollback

on:
  workflow_dispatch:
    inputs:
      confirmRollback:
        description: "Explicitly confirm the emergency production web rollback"
        required: true
        type: boolean
        default: false
      taskDefinition:
        description: "Exact web task definition (ai-shipping-labs-prod:<revision>)"
        required: true
        type: string
      expectedTag:
        description: "Exact tag that production /ping must return"
        required: true
        type: string

concurrency:
  group: emergency-production-web-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback Production Web Service
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-west-1
      AWS_ACCOUNT_ID: "387546586013"
      ECS_CLUSTER: ai-shipping-labs
      ECS_WEB_SERVICE: ai-shipping-labs-prod
      PROD_PING_URL: https://aishippinglabs.com/ping
      CONFIRM_ROLLBACK: ${{ inputs.confirmRollback }}
      TASK_DEFINITION: ${{ inputs.taskDefinition }}
      EXPECTED_TAG: ${{ inputs.expectedTag }}

    steps:
      - name: Validate emergency rollback inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${CONFIRM_ROLLBACK}" != "true" ]]; then
            echo "::error ::Emergency production rollback was not explicitly confirmed."
            exit 1
          fi

          if [[ ! "${TASK_DEFINITION}" =~ ^ai-shipping-labs-prod:[1-9][0-9]*$ ]]; then
            echo "::error ::taskDefinition must match ai-shipping-labs-prod:<positive revision>."
            exit 1
          fi

          if [[ ! "${EXPECTED_TAG}" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7,40}$ ]]; then
            echo "::error ::expectedTag must be an immutable timestamp-and-commit deployment tag."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::387546586013:role/website-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve exact task definition
        shell: bash
        run: |
          set -euo pipefail

          expected_arn="arn:aws:ecs:${AWS_REGION}:${AWS_ACCOUNT_ID}:task-definition/${TASK_DEFINITION}"
          resolved_arn="$(aws ecs describe-task-definition \
            --region "${AWS_REGION}" \
            --task-definition "${TASK_DEFINITION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          if [[ "${resolved_arn}" != "${expected_arn}" ]]; then
            echo "::error ::Resolved task definition does not exactly match the requested production web revision."
            exit 1
          fi

          echo "RESOLVED_TASK_DEFINITION=${resolved_arn}" >> "${GITHUB_ENV}"

      - name: Roll back production web service only
        shell: bash
        run: |
          set -euo pipefail

          updated_arn="$(aws ecs update-service \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_WEB_SERVICE}" \
            --task-definition "${RESOLVED_TASK_DEFINITION}" \
            --query 'service.taskDefinition' \
            --output text)"

          if [[ "${updated_arn}" != "${RESOLVED_TASK_DEFINITION}" ]]; then
            echo "::error ::ECS did not accept the exact requested web task definition."
            exit 1
          fi

          aws ecs wait services-stable \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_WEB_SERVICE}"

          current_arn="$(aws ecs describe-services \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_WEB_SERVICE}" \
            --query 'services[0].taskDefinition' \
            --output text)"

          if [[ "${current_arn}" != "${RESOLVED_TASK_DEFINITION}" ]]; then
            echo "::error ::ECS stabilized on a task definition other than the requested rollback revision."
            exit 1
          fi

      - name: Verify recovered production tag
        shell: bash
        run: |
          set -euo pipefail

          consecutive_matches=0
          for attempt in $(seq 1 40); do
            observed_tag="$(curl -fsSL \
              --connect-timeout 3 \
              --max-time 5 \
              "${PROD_PING_URL}" 2>/dev/null || true)"

            if [[ "${observed_tag}" == "${EXPECTED_TAG}" ]]; then
              consecutive_matches=$((consecutive_matches + 1))
              echo "Attempt ${attempt}/40: exact tag match (${consecutive_matches}/3)."
              if [[ "${consecutive_matches}" -ge 3 ]]; then
                echo "::notice ::Production web rollback verified with three consecutive exact /ping matches."
                exit 0
              fi
            else
              consecutive_matches=0
              echo "Attempt ${attempt}/40: production /ping is unreachable or does not match the expected tag."
            fi

            sleep 10
          done

          echo "::error ::Production /ping did not return the exact expected tag three consecutive times."
          exit 1
