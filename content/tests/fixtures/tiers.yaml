- name: Basic
  stripe_key: basic
  level: 10
  tagline: Content only
  price_monthly: 20
  price_annual: 200
  hook: Learn independently with practical member resources.
  description: >
    Learn independently with exclusive written content and practical workshop
    materials.
  positioning: >
    Best for independent builders who prefer self-paced learning.
    Upgrade to Main for structure, accountability, and community support.
  highlighted: false
  benefits:
    - title: Exclusive written content
      icon: file-text
      description: >
        Read exclusive articles, practical tutorials with code examples,
        research notes, and curated breakdowns of useful AI tools and
        workflows you can apply to your own projects.
      action_label: Browse member articles
      action_url: /blog
    - title: Workshop content
      icon: presentation
      description: >
        Access recordings, step-by-step tutorials, and practical materials
        from most AI Shipping Labs workshops, then work through them at your
        own pace whenever you need them.
      action_label: Browse workshops
      action_url: /workshops

- name: Main
  stripe_key: main
  level: 20
  tagline: Live learning + community
  price_monthly: 50
  price_annual: 500
  hook: >
    Build with the community and get the accountability and direction
    you need to make progress.
  description: >
    Add live participation, accountability, and peer support to keep shipping
    consistently.
  positioning: >
    Best for builders who need structure and accountability to turn project
    ideas into reality alongside motivated peers.
  highlighted: true
  benefits:
    - title: Community sprints
      icon: timer
      description: >
        Join time-boxed cohorts with check-ins, deadlines, and accountability
        for shipping one project while making your progress visible to the
        community.
      action_label: Explore community sprints
      action_url: /sprints
    - title: Live events
      icon: calendar-days
      description: >
        Take part in live building sessions, office hours, mock interviews,
        and career conversations where you can ask questions and learn with
        other members.
      action_label: View live events
      action_url: /events
    - title: Private Slack community
      icon: messages-square
      description: >
        Ask questions, get feedback, learn with other builders, and follow
        practical discussions in a private workspace focused on making
        meaningful progress.
      action_label: ""
      action_url: ""
    - title: Personalized onboarding plan
      icon: list-checks
      description: >
        We talk with you about your career plans and ambitions, then develop
        a personalized plan that gives your membership a clear direction
        from the start.
      action_label: ""
      action_url: ""
    - title: Topic voting
      icon: vote
      description: >
        Help choose the course topics the community develops next and make
        the learning roadmap reflect the practical skills members want to
        build.
      action_label: Vote on topics
      action_url: /vote

- name: Premium
  stripe_key: premium
  level: 30
  tagline: Courses + personalized feedback
  price_monthly: 100
  price_annual: 1000
  hook: Accelerate your growth with structured courses and personalized feedback.
  description: >
    Add structured courses and personal career feedback to sharpen your
    direction.
  positioning: >
    Best for builders seeking structured learning paths to complement hands-on
    projects, plus personalized career guidance.
  highlighted: false
  benefits:
    - title: Courses
      icon: book-open
      description: >
        Follow structured courses on specialized topics, build skills through
        practical learning paths, and return to the materials whenever you
        need a focused way to deepen your knowledge.
      action_label: Browse courses
      action_url: /courses
    - title: Resume and LinkedIn teardown
      icon: contact-round
      description: ""
      action_label: ""
      action_url: ""
    - title: GitHub feedback
      icon: github
      description: ""
      action_label: ""
      action_url: ""
