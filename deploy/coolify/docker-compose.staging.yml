# Coolify service template for AISHL staging (Contabo).
# Secrets (SECRET_KEY, DATABASE_URL, etc.) live in Coolify UI / API
# environment variables — never inline them here.
# Image tag: exact ECR format YYYYMMDD-HHMMSS-<7> (never :latest, never sha-<…>).
# CD path: GitHub Actions builds → GHCR → Coolify deploy webhook (no git clone on Contabo).
#
# Boot path: empty argv → entrypoint.sh hands off to
# scripts/entrypoint_init.py legacy mode. RUN_MIGRATIONS=true makes this
# single container the sole migrator (issue #336) then serves gunicorn via
# scripts/gunicorn_runtime.py defaults (gthread, --preload).
# Health path: GET /ping via website.middleware.HealthCheckMiddleware
# (200 + VERSION, no DB hit, bypasses ALLOWED_HOSTS).
services:
  web:
    image: ghcr.io/ai-shipping-labs/website:20261021-094333-f922dc4
    pull_policy: always
    restart: unless-stopped
    environment:
      DEBUG: "0"
      # No SITE_BASE_URL pin here. This single service answers for both
      # the production hostnames (apex, www) and dev.aishippinglabs.com,
      # so one static origin cannot be right for every request: pinning
      # the dev URL would noindex production, pinning production leaves
      # dev presenting prod sitemap/robots. The app derives the crawler
      # surfaces per request host instead (website/search_indexing.py:
      # a dev-host request always gets dev sitemap origin, minimal
      # robots, and noindex, regardless of the configured origin).
      # Keep this in sync with SITE_BASE_URL_BY_ENV only when dev gets
      # its own service; until then the shared box stays on the
      # production-literal default in website/settings.py.
      RUN_MIGRATIONS: "true"
      SERVING_BOOT_SMOKE_CHECK_ENABLED: "false"
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ping", timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    expose:
      - "8000"
