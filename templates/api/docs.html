<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Shipping Labs Operator API</title>
  <!--
    Issue #1906: swagger-ui-dist 5.17.14 is vendored under
    static/vendor/swagger-ui-dist/5.17.14/ instead of a third-party CDN
    (same remedy as #1846 for the member API docs). The pinned library
    and version are unchanged; the assets are now served from the repo
    like static/vendor/mermaid/.
  -->
  <link
    rel="stylesheet"
    href="{% static 'vendor/swagger-ui-dist/5.17.14/swagger-ui.css' %}"
  >
  <style>
    body { margin: 0; }
    #swagger-ui { box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script
    src="{% static 'vendor/swagger-ui-dist/5.17.14/swagger-ui-bundle.js' %}"
  ></script>
  <script
    src="{% static 'vendor/swagger-ui-dist/5.17.14/swagger-ui-standalone-preset.js' %}"
  ></script>
  <script>
    window.addEventListener('load', function() {
      window.ui = SwaggerUIBundle({
        url: '/api/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset,
        ],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: 'StandaloneLayout',
      });
    });
  </script>
</body>
</html>
