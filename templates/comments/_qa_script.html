{% load accounts_extras %}
<script>
  // Q&A Section — multi-instance safe.
  //
  // Each thread is a `.qa-thread` wrapper carrying `data-content-id`. A page
  // may render one thread (course unit / workshop page / plan) or many (the
  // Book Club chapter page, issue #1365, renders one thread per member note).
  // Element lookups are scoped WITHIN each thread by class, so this script is
  // agnostic to the id suffixes `_qa_section.html` emits for multiple threads.
  //
  // Staff moderation (issue #1894): when the list payload says
  // `can_moderate`, every top-level comment and reply also renders Edit and
  // Delete (soft hide). The list payload is the source of truth -- the
  // server enforces the same staff-only rule on the write endpoints.
  //
  // Read-only archive (issue #1925): a wrapper with `data-read-only="true"`
  // renders no Reply toggle, reply form, or vote button (the vote count
  // stays visible). Staff moderation still renders. UI-level only: the
  // write endpoints are unchanged.
  (function() {
    var sections = document.querySelectorAll('.qa-thread');
    if (!sections.length) return;

    var FOCUS_RING = 'focus-visible:outline-none focus-visible:ring-2 ' +
      'focus-visible:ring-accent focus-visible:ring-offset-2 ' +
      'focus-visible:ring-offset-background';

    function getCsrfToken() {
      var cookies = document.cookie.split(';');
      for (var i = 0; i < cookies.length; i++) {
        var cookie = cookies[i].trim();
        if (cookie.startsWith('csrftoken=')) return cookie.substring('csrftoken='.length);
      }
      return '';
    }

    function padTwo(value) {
      return String(value).padStart(2, '0');
    }

    function commentTime(isoStr) {
      var date = new Date(isoStr);
      var now = new Date();
      var diff = Math.floor((now - date) / 1000);
      if (diff < 60) return { text: 'just now' };
      if (diff < 3600) return { text: Math.floor(diff / 60) + ' minutes ago' };
      if (diff < 86400) return { text: Math.floor(diff / 3600) + ' hours ago' };
      if (diff < 2592000) return { text: Math.floor(diff / 86400) + ' days ago' };
      return {
        text: padTwo(date.getDate()) + '/' + padTwo(date.getMonth() + 1) + '/' + date.getFullYear(),
        accessibleLabel: date.toLocaleString(undefined, {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          timeZoneName: 'long',
        }),
      };
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderTimestamp(isoStr, testId) {
      var display = commentTime(isoStr);
      var accessible = display.accessibleLabel
        ? ' aria-label="' + escapeHtml(display.accessibleLabel) + '"'
        : '';
      return '<time class="shrink-0" data-testid="' + testId + '" datetime="' + escapeHtml(isoStr) + '"' + accessible + '>' + display.text + '</time>';
    }

    function renderEditedMarker() {
      return '<span class="text-xs text-muted-foreground" data-testid="qa-edited">Edited</span>';
    }

    function renderModerationButtons(id) {
      return '<button class="qa-edit-btn text-xs text-accent hover:underline ' + FOCUS_RING + '" data-comment-id="' + id + '" data-testid="qa-edit">Edit</button>' +
        '<button class="qa-delete-btn text-xs text-red-700 dark:text-red-400 hover:underline ' + FOCUS_RING + '" data-comment-id="' + id + '" data-testid="qa-delete">Delete</button>';
    }

    function renderEditForm(id, body) {
      return '<div class="qa-edit-form hidden mt-2" data-comment-id="' + id + '">' +
        '<textarea rows="3" class="qa-edit-textarea w-full rounded-lg border border-border bg-card p-2 text-sm text-foreground placeholder:text-muted-foreground focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent">' + escapeHtml(body) + '</textarea>' +
        '<button class="{% button_classes 'primary' size='sm' extra='qa-save-edit mt-1' %}" data-comment-id="' + id + '" data-testid="qa-save-edit">Save</button>' +
        '<button class="{% button_classes 'secondary' size='sm' extra='qa-cancel-edit mt-1 sm:ml-2' %}" data-comment-id="' + id + '" data-testid="qa-cancel-edit">Cancel</button>' +
      '</div>';
    }

    function renderMetaLine(name, isoStr, timestampTestId, isEdited) {
      return '<div class="mb-1 flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1 text-xs text-muted-foreground">' +
        '<span class="min-w-0 break-words font-medium text-foreground">' + escapeHtml(name) + '</span>' +
        renderTimestamp(isoStr, timestampTestId) +
        (isEdited ? renderEditedMarker() : '') +
      '</div>';
    }

    var UPVOTE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

    function renderVoteControl(comment, readOnly) {
      if (readOnly) {
        // Archived threads keep earned upvotes visible but not clickable;
        // a zero count is omitted rather than shown as a bare "0".
        if (!comment.vote_count) return '';
        return '<span class="text-muted-foreground" aria-hidden="true">' + UPVOTE_SVG + '</span>' +
          '<span class="qa-vote-count text-sm font-medium" aria-label="' + comment.vote_count + ' upvotes">' + comment.vote_count + '</span>';
      }
      var votedClass = comment.user_voted
        ? 'text-accent'
        : 'text-muted-foreground hover:text-foreground';
      var votedFill = comment.user_voted ? 'fill-current' : '';
      return '<button class="qa-vote-btn transition-colors ' + votedClass + '" data-comment-id="' + comment.id + '" title="Upvote">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + votedFill + '"><path d="M12 19V5M5 12l7-7 7 7"/></svg>' +
        '</button>' +
        '<span class="qa-vote-count text-sm font-medium">' + comment.vote_count + '</span>';
    }

    function renderReplyControls(comment, readOnly) {
      if (readOnly) return { toggle: '', form: '' };
      return {
        toggle: '<button class="qa-reply-toggle text-xs text-accent hover:underline" data-comment-id="' + comment.id + '">Reply</button>',
        form: '<div class="qa-reply-form hidden mt-2" data-comment-id="' + comment.id + '">' +
          '<textarea rows="2" placeholder="Write a reply..." class="w-full rounded-lg border border-border bg-card p-2 text-sm text-foreground placeholder:text-muted-foreground focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent"></textarea>' +
          '<button class="{% button_classes 'primary' size='sm' extra='qa-reply-btn mt-1' %}" data-comment-id="' + comment.id + '">Post reply</button>' +
        '</div>',
      };
    }

    function renderComment(comment, canModerate, readOnly) {
      var modButtons = canModerate ? renderModerationButtons(comment.id) : '';
      var editForm = canModerate ? renderEditForm(comment.id, comment.body) : '';

      var repliesHtml = '';
      if (comment.replies && comment.replies.length > 0) {
        repliesHtml = '<div class="ml-4 sm:ml-8 mt-4 space-y-3">';
        for (var i = 0; i < comment.replies.length; i++) {
          var r = comment.replies[i];
          var replyMod = canModerate ? renderModerationButtons(r.id) : '';
          var replyEditForm = canModerate ? renderEditForm(r.id, r.body) : '';
          var replyActions = replyMod
            ? '<div class="flex flex-wrap items-center gap-x-4 gap-y-1">' + replyMod + '</div>'
            : '';
          repliesHtml += '<div class="qa-card rounded-lg border border-border bg-muted/30 p-3" data-comment-id="' + r.id + '">' +
            renderMetaLine(r.user_name, r.created_at, 'reply-timestamp', r.is_edited) +
            '<p class="qa-body break-words text-sm text-foreground">' + escapeHtml(r.body) + '</p>' +
            replyActions +
            replyEditForm +
          '</div>';
        }
        repliesHtml += '</div>';
      }

      var hasReplies = comment.replies && comment.replies.length > 0;
      var reply = renderReplyControls(comment, readOnly);
      var actionsHtml = reply.toggle + modButtons;
      var voteHtml = renderVoteControl(comment, readOnly);

      return '<div class="qa-card mb-4 rounded-lg border border-border bg-card p-4" data-comment-id="' + comment.id + '" data-reply-count="' + (hasReplies ? comment.replies.length : 0) + '">' +
        '<div class="flex gap-3">' +
          (voteHtml
            ? '<div class="flex flex-col items-center gap-1">' + voteHtml + '</div>'
            : '') +
          '<div class="flex-1 min-w-0">' +
            renderMetaLine(comment.user_name, comment.created_at, 'comment-timestamp', comment.is_edited) +
            '<p class="qa-body mb-2 break-words text-sm text-foreground">' + escapeHtml(comment.body) + '</p>' +
            (actionsHtml
              ? '<div class="flex flex-wrap items-center gap-x-4 gap-y-1">' + actionsHtml + '</div>'
              : '') +
            reply.form +
            editForm +
            repliesHtml +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function wireThread(section) {
      var contentId = section.dataset.contentId;
      var listEl = section.querySelector('.qa-list');
      var countEl = section.querySelector('.qa-count');
      var countWrapperEl = section.querySelector('.qa-count-wrapper');
      var postBtn = section.querySelector('.qa-post-btn');
      var textarea = section.querySelector('.qa-new-question');
      var readOnly = section.dataset.readOnly === 'true';
      if (!listEl) return;

      function loadComments() {
        fetch('/api/comments/' + contentId, { credentials: 'same-origin' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var comments = data.comments || [];
            var canModerate = data.can_moderate === true;
            if (countEl) countEl.textContent = comments.length;
            // Lets a host surface mirror the visible count (the homework
            // review archive summary, issue #1925) without reaching in.
            section.dispatchEvent(new CustomEvent('qa:loaded', {
              bubbles: true,
              detail: { count: comments.length },
            }));
            // Hide the parenthesized count entirely when the thread is
            // empty so the heading reads "Comments" rather than
            // "Comments (0)" (issue #597). The count span itself is kept
            // in the DOM so existing tests/scripts still find it.
            if (countWrapperEl) {
              if (comments.length > 0) {
                countWrapperEl.removeAttribute('hidden');
              } else {
                countWrapperEl.setAttribute('hidden', '');
              }
            }
            if (comments.length === 0) {
              listEl.innerHTML = '';
              return;
            }
            var html = '';
            for (var i = 0; i < comments.length; i++) {
              html += renderComment(comments[i], canModerate, readOnly);
            }
            listEl.innerHTML = html;
            bindEvents();
          });
      }

      function postModeration(cid, path, payload) {
        return fetch('/api/comments/' + cid + '/' + path, {
          method: 'POST',
          headers: { 'X-CSRFToken': getCsrfToken(), 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          // Only the edit route carries a payload ({ body: ... }); hide is
          // a bare POST (issue #1894).
          body: payload ? JSON.stringify(payload) : null,
        });
      }

      function bindEvents() {
        // Vote buttons
        var voteBtns = listEl.querySelectorAll('.qa-vote-btn');
        for (var i = 0; i < voteBtns.length; i++) {
          voteBtns[i].addEventListener('click', function() {
            var cid = this.dataset.commentId;
            var btn = this;
            fetch('/api/comments/' + cid + '/vote', {
              method: 'POST',
              headers: { 'X-CSRFToken': getCsrfToken(), 'Content-Type': 'application/json' },
              credentials: 'same-origin',
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.error) return;
              var card = btn.closest('[data-comment-id]');
              var countSpan = card.querySelector('.qa-vote-count');
              countSpan.textContent = data.vote_count;
              var svg = btn.querySelector('svg');
              if (data.voted) {
                btn.className = 'qa-vote-btn transition-colors text-accent';
                svg.classList.add('fill-current');
              } else {
                btn.className = 'qa-vote-btn transition-colors text-muted-foreground hover:text-foreground';
                svg.classList.remove('fill-current');
              }
            });
          });
        }

        // Reply toggles
        var replyToggles = listEl.querySelectorAll('.qa-reply-toggle');
        for (var i = 0; i < replyToggles.length; i++) {
          replyToggles[i].addEventListener('click', function() {
            var cid = this.dataset.commentId;
            var form = listEl.querySelector('.qa-reply-form[data-comment-id="' + cid + '"]');
            form.classList.toggle('hidden');
          });
        }

        // Reply submit buttons
        var replyBtns = listEl.querySelectorAll('.qa-reply-btn');
        for (var i = 0; i < replyBtns.length; i++) {
          replyBtns[i].addEventListener('click', function() {
            var cid = this.dataset.commentId;
            var form = listEl.querySelector('.qa-reply-form[data-comment-id="' + cid + '"]');
            var ta = form.querySelector('textarea');
            var body = ta.value.trim();
            if (!body) return;
            fetch('/api/comments/' + cid + '/reply', {
              method: 'POST',
              headers: { 'X-CSRFToken': getCsrfToken(), 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ body: body }),
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if (data.error) return;
              ta.value = '';
              form.classList.add('hidden');
              loadComments();
            });
          });
        }

        // Staff moderation (issue #1894). Edit opens an inline form
        // prefilled with the current body; Delete asks for confirmation
        // and soft-hides the comment.
        var editBtns = listEl.querySelectorAll('.qa-edit-btn');
        for (var i = 0; i < editBtns.length; i++) {
          editBtns[i].addEventListener('click', function() {
            var cid = this.dataset.commentId;
            var card = this.closest('.qa-card');
            var bodyEl = card.querySelector('.qa-body');
            var form = card.querySelector('.qa-edit-form[data-comment-id="' + cid + '"]');
            form.classList.remove('hidden');
            bodyEl.setAttribute('hidden', '');
            form.querySelector('.qa-edit-textarea').focus();
          });
        }

        var saveBtns = listEl.querySelectorAll('.qa-save-edit');
        for (var i = 0; i < saveBtns.length; i++) {
          saveBtns[i].addEventListener('click', function() {
            var cid = this.dataset.commentId;
            var card = this.closest('.qa-card');
            var form = card.querySelector('.qa-edit-form[data-comment-id="' + cid + '"]');
            var ta = form.querySelector('.qa-edit-textarea');
            var body = ta.value.trim();
            // A blank or whitespace-only save never persists and never
            // empties the card: stay in edit mode with the original body.
            if (!body) return;
            postModeration(cid, 'edit', { body: body })
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data.error) return;
                loadComments();
              });
          });
        }

        var cancelBtns = listEl.querySelectorAll('.qa-cancel-edit');
        for (var i = 0; i < cancelBtns.length; i++) {
          cancelBtns[i].addEventListener('click', function() {
            var cid = this.dataset.commentId;
            var card = this.closest('.qa-card');
            var form = card.querySelector('.qa-edit-form[data-comment-id="' + cid + '"]');
            var bodyEl = card.querySelector('.qa-body');
            form.classList.add('hidden');
            bodyEl.removeAttribute('hidden');
          });
        }

        var deleteBtns = listEl.querySelectorAll('.qa-delete-btn');
        for (var i = 0; i < deleteBtns.length; i++) {
          deleteBtns[i].addEventListener('click', function() {
            var cid = this.dataset.commentId;
            var card = this.closest('.qa-card');
            var isTopLevel = card.dataset.replyCount !== undefined;
            var replyCount = parseInt(card.dataset.replyCount || '0', 10);
            var message = 'Remove this comment from the thread?';
            if (isTopLevel && replyCount > 0) {
              message += ' Replies will also leave the thread until the comment is restored.';
            }
            if (!window.confirm(message)) return;
            postModeration(cid, 'hide')
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data.error) return;
                loadComments();
              });
          });
        }
      }

      // Post new question
      if (postBtn && textarea) {
        postBtn.addEventListener('click', function() {
          var body = textarea.value.trim();
          if (!body) return;
          fetch('/api/comments/' + contentId, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCsrfToken(), 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ body: body }),
          })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.error) return;
            textarea.value = '';
            loadComments();
          });
        });
      }

      loadComments();
    }

    for (var s = 0; s < sections.length; s++) {
      wireThread(sections[s]);
    }
  })();
</script>
