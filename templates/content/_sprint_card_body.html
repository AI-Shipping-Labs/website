{% load sprint_extras %}
<p class="mt-2 line-clamp-2 text-sm leading-6 text-muted-foreground sm:text-base" data-testid="sprints-sprint-context">
  A sprint is a time-bound shipping cohort with project structure, accountability check-ins, and community progress.
</p>
<div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-muted-foreground">
  <span class="flex items-center gap-1.5" data-testid="sprints-sprint-dates">
    <i data-lucide="calendar-range" class="h-4 w-4 flex-shrink-0"></i>
    <span><span class="sr-only">Sprint window: </span>{% sprint_date_range item.sprint %}</span>
  </span>
</div>
