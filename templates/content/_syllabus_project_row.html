{% load date_formatting %}
<div class="flex min-h-[52px] items-center gap-2 rounded-md px-3 text-sm" data-testid="syllabus-project-attempt">
  <i data-lucide="folder-git-2" class="h-4 w-4 flex-shrink-0 text-muted-foreground" aria-hidden="true"></i>
  <a href="{% url 'course_project_submit' slug=course_slug attempt_slug=project.slug %}"
     class="min-w-0 flex-1 rounded-md py-2.5 text-foreground hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent">
    <span class="block font-medium">{{ project.title }}</span>
    <span class="mt-0.5 block text-xs font-normal text-muted-foreground">Submit {{ project.submission_due_at|member_short_date }} · Review {{ project.review_due_at|member_short_date }}</span>
  </a>
  <a href="{% url 'course_project_reviews' slug=course_slug attempt_slug=project.slug %}"
     class="flex min-h-[44px] shrink-0 items-center rounded-md px-2 text-xs text-muted-foreground hover:bg-muted/50 hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
     aria-label="Peer reviews for {{ project.title }}">Reviews</a>
</div>
