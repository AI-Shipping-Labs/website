<script>
  (function() {
    var STORAGE_KEY = 'content-sidebar-collapsed';
    var TOP_STORAGE_KEY = 'content-sidebar-toggle-top';
    var collapseBtn = document.getElementById('content-sidebar-collapse-btn');
    var floatingBtn = document.getElementById('content-sidebar-floating-toggle');
    var breadcrumb = document.querySelector('[data-reader-breadcrumb]');
    if (!collapseBtn && !floatingBtn) return;

    function getCollapsed() {
      try { return localStorage.getItem(STORAGE_KEY) === '1'; }
      catch (e) { return false; }
    }
    function getSavedTop() {
      try {
        var top = Number.parseFloat(localStorage.getItem(TOP_STORAGE_KEY));
        return Number.isFinite(top) ? top : null;
      } catch (e) {
        return null;
      }
    }
    function saveTop(top) {
      try { localStorage.setItem(TOP_STORAGE_KEY, String(top)); }
      catch (e) { /* localStorage disabled, current page still stays aligned */ }
    }
    function alignWithBreadcrumb() {
      if (!floatingBtn || !breadcrumb) return;
      /* The expanded control uses -mt-0.5, so mirror its two-pixel offset
         from the top of the breadcrumb row. */
      floatingBtn.style.top = (breadcrumb.getBoundingClientRect().top - 2) + 'px';
    }
    function setCollapsed(collapsed) {
      try { localStorage.setItem(STORAGE_KEY, collapsed ? '1' : '0'); }
      catch (e) { /* localStorage disabled, in-memory only */ }
      document.documentElement.setAttribute(
        'data-content-sidebar', collapsed ? 'collapsed' : 'expanded'
      );
      if (collapseBtn) collapseBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      if (floatingBtn) floatingBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    }

    var initiallyCollapsed = getCollapsed();
    if (initiallyCollapsed && floatingBtn) {
      var savedTop = getSavedTop();
      if (savedTop === null) {
        alignWithBreadcrumb();
      } else {
        floatingBtn.style.top = savedTop + 'px';
      }
    }
    setCollapsed(initiallyCollapsed);
    if (collapseBtn) {
      collapseBtn.addEventListener('click', function() {
        /* Keep the restore control on the exact vertical line where the
           collapse control was clicked, including from the sticky state. */
        if (floatingBtn) {
          var top = collapseBtn.getBoundingClientRect().top;
          floatingBtn.style.top = top + 'px';
          saveTop(top);
        }
        setCollapsed(true);
      });
    }
    if (floatingBtn) {
      floatingBtn.addEventListener('click', function() { setCollapsed(false); });
    }
  })();

  (function() {
    /* Below `lg` the reader nav is a modal drawer on every reader: backdrop
       that closes on tap, scroll lock, role="dialog" + aria-modal, focus
       loop, Escape to close, and focus returned to the toggle. On `lg+`
       the same <nav> is the persistent sidebar, so the dialog semantics are
       only applied while the drawer is open. */
    var toggleBtn = document.getElementById('sidebar-toggle-btn');
    var nav = document.getElementById('sidebar-nav');
    var closeBtn = document.getElementById('reader-scoped-nav-close');
    if (!toggleBtn || !nav) return;
    var desktop = window.matchMedia('(min-width: 1024px)');
    var backdrop = document.createElement('div');
    backdrop.id = 'reader-drawer-backdrop';
    backdrop.className = 'reader-drawer-backdrop';
    backdrop.hidden = true;
    backdrop.setAttribute('aria-hidden', 'true');
    backdrop.setAttribute('data-testid', 'reader-drawer-backdrop');
    nav.parentNode.insertBefore(backdrop, nav);

    function isOpen() { return !nav.classList.contains('hidden'); }
    function focusables() {
      return Array.prototype.filter.call(
        nav.querySelectorAll('a[href], button:not([disabled]), summary, [tabindex]:not([tabindex="-1"])'),
        function(el) { return el.offsetParent !== null || el === document.activeElement; }
      );
    }
    /* Group D hook: the row marked `data-reader-current` (for example the
       current homework step) wins over the current lesson/page row. */
    function scrollCurrentIntoView() {
      var current = nav.querySelector('[data-reader-current]') || nav.querySelector('[aria-current="page"]');
      if (!current) return;
      var navRect = nav.getBoundingClientRect();
      var rowRect = current.getBoundingClientRect();
      nav.scrollTop += (rowRect.top - navRect.top) - (nav.clientHeight - rowRect.height) / 2;
    }
    function setOpen(open) {
      if (open) {
        nav.classList.remove('hidden');
        nav.setAttribute('role', 'dialog');
        nav.setAttribute('aria-modal', 'true');
        backdrop.hidden = false;
        document.documentElement.classList.add('reader-drawer-open');
        toggleBtn.setAttribute('aria-expanded', 'true');
        scrollCurrentIntoView();
        (closeBtn || nav).focus();
      } else {
        nav.classList.add('hidden');
        nav.removeAttribute('role');
        nav.removeAttribute('aria-modal');
        backdrop.hidden = true;
        document.documentElement.classList.remove('reader-drawer-open');
        toggleBtn.setAttribute('aria-expanded', 'false');
        toggleBtn.focus();
      }
    }
    toggleBtn.addEventListener('click', function() { setOpen(!isOpen()); });
    backdrop.addEventListener('click', function() { setOpen(false); });
    if (closeBtn) closeBtn.addEventListener('click', function() { setOpen(false); });
    document.addEventListener('keydown', function(event) {
      if (!isOpen() || desktop.matches) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        setOpen(false);
        return;
      }
      if (event.key !== 'Tab') return;
      var items = focusables();
      if (!items.length) return;
      var first = items[0];
      var last = items[items.length - 1];
      if (event.shiftKey && (document.activeElement === first || !nav.contains(document.activeElement))) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (document.activeElement === last || !nav.contains(document.activeElement))) {
        event.preventDefault();
        first.focus();
      }
    });
    /* Crossing into `lg` turns the drawer back into the sidebar. */
    desktop.addEventListener('change', function(event) {
      if (!event.matches || !isOpen()) return;
      nav.classList.add('hidden');
      nav.removeAttribute('role');
      nav.removeAttribute('aria-modal');
      backdrop.hidden = true;
      document.documentElement.classList.remove('reader-drawer-open');
      toggleBtn.setAttribute('aria-expanded', 'false');
    });
  })();

  (function() {
    var duration = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 150;

    function disclosureContent(details) {
      return Array.prototype.filter.call(details.children, function(child) {
        return child.tagName !== 'SUMMARY';
      });
    }

    function animateDisclosure(details, open) {
      if (details.dataset.readerAnimating === 'true') return;
      var summary = details.querySelector(':scope > summary');
      if (!summary) {
        details.open = open;
        return;
      }

      var contents = disclosureContent(details);
      var summaryHeight = summary.getBoundingClientRect().height;
      if (duration === 0 || typeof details.animate !== 'function') {
        details.open = open;
        details.classList.remove('is-closing');
        return;
      }

      details.dataset.readerAnimating = 'true';
      details.style.overflow = 'hidden';
      if (open) {
        details.style.height = summaryHeight + 'px';
        details.open = true;
        var expandedHeight = details.scrollHeight;
        var expand = details.animate(
          [{ height: summaryHeight + 'px' }, { height: expandedHeight + 'px' }],
          { duration: duration, easing: 'cubic-bezier(0.2, 0, 0, 1)' }
        );
        contents.forEach(function(content) {
          content.animate(
            [{ opacity: 0, transform: 'translateY(-2px)' }, { opacity: 1, transform: 'translateY(0)' }],
            { duration: duration, easing: 'ease-out' }
          );
        });
        expand.onfinish = function() {
          details.style.height = '';
          details.style.overflow = '';
          delete details.dataset.readerAnimating;
        };
        return;
      }

      details.classList.add('is-closing');
      var expandedHeight = details.getBoundingClientRect().height;
      var collapse = details.animate(
        [{ height: expandedHeight + 'px' }, { height: summaryHeight + 'px' }],
        { duration: duration, easing: 'cubic-bezier(0.2, 0, 0, 1)' }
      );
      contents.forEach(function(content) {
        content.animate(
          [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-2px)' }],
          { duration: duration, easing: 'ease-in' }
        );
      });
      collapse.onfinish = function() {
        details.open = false;
        details.classList.remove('is-closing');
        details.style.height = '';
        details.style.overflow = '';
        delete details.dataset.readerAnimating;
      };
    }

    document.addEventListener('click', function(event) {
      var summary = event.target.closest('details.sidebar-module > summary');
      if (!summary) return;
      // Issue #1794: the homework outline's heading keeps the unit's
      // canonical link inside the summary (same anchor-in-summary
      // pattern as the syllabus group). A click on that link must
      // navigate, not toggle; the rest of the row toggles.
      if (event.target.closest('a')) return;
      event.preventDefault();
      var details = summary.parentElement;
      if (details.open) {
        animateDisclosure(details, false);
        return;
      }
      if (details.hasAttribute('data-reader-submodule')) {
        var scopedModule = details.closest('[data-testid="reader-scoped-module"]');
        if (scopedModule) scopedModule.querySelectorAll('details[data-reader-submodule][open]').forEach(function(other) {
          if (other !== details) animateDisclosure(other, false);
        });
      }
      animateDisclosure(details, true);
    });
  })();

  (function() {
    var buttons = document.querySelectorAll('[data-completion-toggle]');
    var navigateButtons = document.querySelectorAll('[data-completion-and-navigate]');
    if (!buttons.length && !navigateButtons.length) return;

    function getCsrfToken() {
      var cookies = document.cookie.split(';');
      for (var i = 0; i < cookies.length; i++) {
        var cookie = cookies[i].trim();
        if (cookie.startsWith('csrftoken=')) {
          return cookie.substring('csrftoken='.length);
        }
      }
      return '';
    }

    function renderButton(btn, completed) {
      if (completed) {
        btn.classList.remove('border-border', 'bg-transparent', 'text-foreground', 'hover:bg-secondary');
        btn.classList.add('border-green-500/30', 'bg-green-500/10', 'text-green-800', 'dark:text-green-400', 'hover:bg-green-500/20');
        btn.innerHTML = '<i data-lucide="check-circle-2" class="h-4 w-4"></i> Completed';
      } else {
        btn.classList.remove('border-green-500/30', 'bg-green-500/10', 'text-green-800', 'dark:text-green-400', 'hover:bg-green-500/20');
        btn.classList.add('border-border', 'bg-transparent', 'text-foreground', 'hover:bg-secondary');
        btn.innerHTML = '<i data-lucide="circle" class="h-4 w-4"></i> Mark as completed';
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    // Issue #483: there are now two completion buttons in the DOM —
    // the mobile-only stand-alone button and the desktop-inline button.
    // Both share the same data-completion-url, so a click on either
    // should re-render every matching button so the mobile and desktop
    // copies stay visually in sync after a toggle.
    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        fetch(btn.dataset.completionUrl, {
          method: 'POST',
          headers: {
            'X-CSRFToken': getCsrfToken(),
            'Content-Type': 'application/json',
          },
          credentials: 'same-origin',
        })
        .then(function(response) { return response.json(); })
        .then(function(data) {
          var completed = Boolean(data.completed);
          var url = btn.dataset.completionUrl;
          var siblings = document.querySelectorAll(
            '[data-completion-toggle][data-completion-url="' + url + '"]'
          );
          siblings.forEach(function(sib) { renderButton(sib, completed); });
        });
      });
    });

    navigateButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (btn.disabled) return;
        btn.disabled = true;
        var label = btn.querySelector('span');
        if (label) label.textContent = 'Completing…';
        fetch(btn.dataset.completionUrl, {
          method: 'POST',
          headers: {
            'X-CSRFToken': getCsrfToken(),
            'Content-Type': 'application/json',
          },
          credentials: 'same-origin',
        })
        .then(function(response) {
          if (!response.ok) throw new Error('Completion request failed');
          return response.json();
        })
        .then(function(data) {
          if (!data.completed) throw new Error('Unit was not completed');
          window.location.assign(btn.dataset.navigateUrl);
        })
        .catch(function() {
          btn.disabled = false;
          if (label) label.textContent = 'Complete & Next';
        });
      });
    });
  })();
</script>
