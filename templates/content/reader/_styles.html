<style>
  /* Course lessons and workshop tutorials always use the blog reader width.
     The surrounding frame remains wide only to make room for navigation. */
  #content-sidebar-main {
    width: 100%;
    max-width: 48rem;
    margin-left: auto;
    margin-right: auto;
  }
  @media (min-width: 1024px) {
    #content-layout {
      justify-content: center;
    }
    #content-sidebar-main {
      flex: 0 1 48rem;
      width: auto;
      margin-left: 0;
      margin-right: 0;
    }
    #content-sidebar-aside {
      transition: width 200ms ease, opacity 200ms ease, margin 200ms ease;
    }
    #content-sidebar-sticky {
      display: flex;
      flex-direction: column;
      max-height: calc(100dvh - 7rem);
    }
    #sidebar-nav {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior-y: contain;
    }
    /*
      Issue #1080: `overflow: hidden` is only applied while the sidebar is
      collapsing/collapsed. Applying it at rest turned the <aside> into a
      scroll container, which broke `position: sticky` on the inner wrapper
      (it never pinned on scroll) and shifted the wrapper down by the sticky
      `top` offset at rest, leaving a large empty band above the back-link.
      Clipping is only needed when the width animates to 0.
    */
    :root[data-content-sidebar="collapsed"] #content-sidebar-aside {
      width: 0 !important;
      min-width: 0 !important;
      opacity: 0;
      pointer-events: none;
      margin-right: -2rem;
      overflow: hidden;
    }
    #content-sidebar-floating-toggle {
      /* Keep the restore control out of the reading column at the left edge
         of the viewport. The top value is a fallback for persisted collapsed
         state; click handling preserves the exact y coordinate. */
      display: inline-flex;
      top: calc(9rem - 0.125rem);
      left: 1rem;
      right: auto;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(-3rem);
      transition:
        transform 120ms ease,
        opacity 100ms ease,
        visibility 0s linear 120ms;
    }
    :root[data-content-sidebar="collapsed"] #content-sidebar-floating-toggle {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(0);
      transition-delay: 120ms, 120ms, 120ms;
    }
    #content-sidebar-collapse-btn { display: inline-flex; }
    /* Course units and workshop pages share the module summaries' compact
       desktop row; mobile keeps the 44px touch target. */
    #sidebar-nav .reader-list-row {
      min-height: 0;
      padding: 0.375rem 0.5rem;
    }
    /* Scoped course outlines use a tighter rhythm for long curricula. */
    #sidebar-nav.reader-scoped-nav .reader-list-row {
      padding: 0.25rem 0.5rem;
    }
  }
  @media (max-width: 1023px) {
    #content-sidebar-collapse-btn,
    #content-sidebar-floating-toggle { display: none !important; }
    #sidebar-nav.reader-scoped-nav:not(.hidden) {
      position: fixed;
      z-index: 60;
      top: 5rem;
      left: 1rem;
      right: 1rem;
      max-height: calc(100dvh - 6rem);
      overflow-y: auto;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
    }
  }
  .sidebar-module > summary::-webkit-details-marker,
  .sidebar-module > summary::marker { display: none; }
  .sidebar-module[open] > summary .sidebar-chevron { transform: rotate(90deg); }
  #sidebar-nav .reader-scoped-unit > span:nth-child(2) {
    white-space: normal;
    overflow-wrap: anywhere;
  }
  /* The scoped outline mixes standalone unit lists with expandable topics.
     Give every sibling the same gap, including the first lesson in a topic. */
  #sidebar-nav.reader-scoped-nav [data-testid="reader-scoped-module"] {
    display: flex;
    flex-direction: column;
    gap: 0.125rem;
  }
  #sidebar-nav.reader-scoped-nav .sidebar-module {
    margin-top: 0;
  }
  #sidebar-nav.reader-scoped-nav .sidebar-module > .reader-nav-list {
    margin-top: 0.25rem;
  }
  .sidebar-module[open] > div { animation: sidebarSlideDown 0.15s ease-out; }
  @media (prefers-reduced-motion: reduce) {
    #sidebar-nav.reader-scoped-nav .sidebar-module[open] > div { animation: none; }
    #sidebar-nav.reader-scoped-nav .sidebar-chevron { transition: none; }
  }
  .reader-nav-list > li + li { margin-top: 0.25rem; }
  #sidebar-nav.reader-scoped-nav .reader-nav-list > li + li { margin-top: 0.125rem; }
  @keyframes sidebarSlideDown {
    from { opacity: 0; transform: translateY(-2px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Markdown tables keep their intrinsic width and sit in the middle of the
     reader column. Oversized tables still use the global horizontal scroll. */
  .reader-prose table {
    width: fit-content;
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
  }
</style>
