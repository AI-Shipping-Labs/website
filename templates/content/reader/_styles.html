<style>

      scrollbar-gutter: stable;
      overscroll-behavior-y: contain;

    /*
      Issue #1080: `overflow: hidden` is only applied while the sidebar is
      collapsing/collapsed. Applying it at rest turned the <aside> into a

      `top` offset at rest, leaving a large empty band above the back-link.
      Clipping is only needed when the width animates to 0.

      width: 0 !important;
      min-width: 0 !important;
      opacity: 0;

      left: 1rem;
      right: auto;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateX(-3rem);
      transition:

        opacity 100ms ease,
        visibility 0s linear 120ms;
    }
