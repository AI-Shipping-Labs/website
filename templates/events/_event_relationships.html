{% if event_relationships %}
<section class="mb-12 border-t border-border pt-8"
         aria-labelledby="event-relationship-context-title"
         data-testid="event-relationship-context">
  <h2 id="event-relationship-context-title" class="text-xs font-medium uppercase tracking-widest text-muted-foreground">Part of</h2>
  <nav class="mt-5 divide-y divide-border" aria-label="Related event context">
    {% for relationship in event_relationships %}
      <a href="{{ relationship.url }}"
         class="block py-4 text-xl font-medium tracking-tight text-foreground underline-offset-4 first:pt-0 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-background"
         data-testid="event-relationship-row">{{ relationship.text }}</a>
    {% endfor %}
  </nav>
</section>
{% endif %}
